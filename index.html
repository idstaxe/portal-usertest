<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INS Client Portal User Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a calm single column per campaign — next step, launch line, readiness grid, material, record.
   Tokens follow brand-harmony (INS crimson, paper and ink); status colours always come with a word and an icon. */
:root {
  --paper: oklch(0.985 0.004 80);
  --paper-deep: oklch(0.96 0.007 80);
  --surface: oklch(0.997 0.002 80);
  --ink: oklch(0.2 0.01 50);
  --ink-soft: oklch(0.38 0.01 50);
  --ink-mute: oklch(0.48 0.01 55);
  --rule: oklch(0.88 0.006 70);
  --rule-strong: oklch(0.78 0.008 60);
  --accent: oklch(0.494 0.188 22);
  --accent-hover: oklch(0.42 0.16 22);
  --accent-tint: oklch(0.955 0.02 22);
  --on-accent: oklch(0.99 0 0);
  --ok: oklch(0.47 0.09 155);
  --ok-tint: oklch(0.95 0.03 155);
  --warn: oklch(0.5 0.11 65);
  --warn-tint: oklch(0.96 0.04 80);
  --info: oklch(0.46 0.09 250);
  --info-tint: oklch(0.95 0.02 250);
  --sim: oklch(0.45 0.13 295);
  --sim-tint: oklch(0.96 0.025 295);
  --ins-del: oklch(0.93 0.04 22);
  --ins-add: oklch(0.92 0.05 155);
  --shadow: 0 8px 24px -8px oklch(0.2 0.01 50 / 0.18), 0 1px 2px oklch(0.2 0.01 50 / 0.08);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(0.18 0.008 50); --paper-deep: oklch(0.215 0.008 50); --surface: oklch(0.225 0.009 50);
    --ink: oklch(0.95 0.005 80); --ink-soft: oklch(0.82 0.006 70); --ink-mute: oklch(0.7 0.008 70);
    --rule: oklch(0.32 0.008 50); --rule-strong: oklch(0.42 0.01 50);
    --accent: oklch(0.66 0.16 24); --accent-hover: oklch(0.72 0.14 24); --accent-tint: oklch(0.27 0.05 22); --on-accent: oklch(0.16 0.01 50);
    --ok: oklch(0.76 0.11 155); --ok-tint: oklch(0.27 0.04 155);
    --warn: oklch(0.8 0.12 75); --warn-tint: oklch(0.28 0.045 75);
    --info: oklch(0.76 0.08 250); --info-tint: oklch(0.27 0.035 250);
    --sim: oklch(0.78 0.11 295); --sim-tint: oklch(0.27 0.045 295);
    --ins-del: oklch(0.34 0.07 22); --ins-add: oklch(0.34 0.07 155);
    --shadow: 0 8px 24px -8px oklch(0 0 0 / 0.6), 0 1px 2px oklch(0 0 0 / 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: oklch(0.18 0.008 50); --paper-deep: oklch(0.215 0.008 50); --surface: oklch(0.225 0.009 50);
  --ink: oklch(0.95 0.005 80); --ink-soft: oklch(0.82 0.006 70); --ink-mute: oklch(0.7 0.008 70);
  --rule: oklch(0.32 0.008 50); --rule-strong: oklch(0.42 0.01 50);
  --accent: oklch(0.66 0.16 24); --accent-hover: oklch(0.72 0.14 24); --accent-tint: oklch(0.27 0.05 22); --on-accent: oklch(0.16 0.01 50);
  --ok: oklch(0.76 0.11 155); --ok-tint: oklch(0.27 0.04 155);
  --warn: oklch(0.8 0.12 75); --warn-tint: oklch(0.28 0.045 75);
  --info: oklch(0.76 0.08 250); --info-tint: oklch(0.27 0.035 250);
  --sim: oklch(0.78 0.11 295); --sim-tint: oklch(0.27 0.045 295);
  --ins-del: oklch(0.34 0.07 22); --ins-add: oklch(0.34 0.07 155);
  --shadow: 0 8px 24px -8px oklch(0 0 0 / 0.6), 0 1px 2px oklch(0 0 0 / 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.75rem, 1.4rem + 1.4vw, 2.25rem); }
h2 { font-size: 1.375rem; }
h3 { font-size: 1.125rem; }
p { margin: 0; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.11em; text-transform: uppercase; font-weight: 600; color: var(--ink-mute); }
.muted { color: var(--ink-mute); }
.small { font-size: 0.9rem; }
.tnum { font-variant-numeric: tabular-nums; }
.wrap { max-width: 72rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.stack-lg { display: flex; flex-direction: column; gap: 2.5rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; align-items: center; gap: 1.5rem; min-height: 64px; flex-wrap: wrap; padding-block: 0.4rem; }
.logo { display: flex; align-items: baseline; gap: 0.6rem; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
.logo b { font-family: var(--serif); font-size: 1.5rem; color: var(--accent); letter-spacing: -0.02em; }
.logo span { font-size: 0.9rem; color: var(--ink-soft); }
.nav { display: flex; gap: 0.25rem; }
.nav button { background: none; border: 0; padding: 0.6rem 0.8rem; min-height: 44px; border-radius: var(--r); cursor: pointer; color: var(--ink-soft); font-weight: 500; }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.nav button:hover { color: var(--ink); background: var(--paper-deep); }
.who { margin-left: auto; text-align: right; font-size: 0.9rem; line-height: 1.3; }
.who strong { display: block; font-weight: 600; }
.who label { display: block; }
.as-role { min-height: 40px; width: auto; max-width: 100%; padding: 0.3rem 0.5rem; font-weight: 600; font-size: 0.9rem; }
.badge-count { display: inline-grid; place-items: center; min-width: 1.4rem; height: 1.4rem; padding: 0 0.35rem; border-radius: 1rem; background: var(--accent); color: var(--on-accent); font-size: 0.75rem; font-weight: 600; margin-left: 0.3rem; }

main { padding-block: 2rem 8rem; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 44px; padding: 0.55rem 1.1rem; border-radius: var(--r); border: 1px solid var(--ink); background: transparent; cursor: pointer; font-weight: 500; text-align: center; transition: background 120ms cubic-bezier(.2,0,0,1), color 120ms; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.quiet { border-color: transparent; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; padding-inline: 0.5rem; }
.btn.quiet:hover { background: var(--paper-deep); color: var(--ink); }
.btn.danger { border-color: var(--accent); color: var(--accent); }
.btn.danger:hover { background: var(--accent); color: var(--on-accent); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn[disabled]:hover { background: transparent; color: inherit; }
.btn.primary[disabled]:hover { background: var(--accent); color: var(--on-accent); }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; min-height: 44px; }
.back { align-self: flex-start; text-align: left; background: none; border: 0; padding: 0.4rem 0; min-height: 44px; cursor: pointer; color: var(--ink-soft); }
.back:hover { color: var(--ink); text-decoration: underline; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 600; padding: 0.15rem 0.55rem 0.15rem 0.45rem; border-radius: 1rem; white-space: nowrap; }
.pill svg { width: 15px; height: 15px; flex: none; }
.t-ok { color: var(--ok); background: var(--ok-tint); }
.t-warn { color: var(--warn); background: var(--warn-tint); }
.t-info { color: var(--info); background: var(--info-tint); }
.t-mute { color: var(--ink-soft); background: var(--paper-deep); }
.t-act { color: var(--accent); background: var(--accent-tint); }
.state { display: inline-flex; align-items: flex-start; gap: 0.4rem; font-weight: 500; }
.state svg { width: 17px; height: 17px; margin-top: 0.2rem; flex: none; }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-info { color: var(--info); } .c-mute { color: var(--ink-mute); } .c-act { color: var(--accent); }

/* Prototype markers */
.tag { display: inline-block; font-family: var(--mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.02em; padding: 0.05rem 0.4rem; border: 1px dashed var(--sim); color: var(--sim); border-radius: 2px; vertical-align: middle; white-space: nowrap; background: var(--sim-tint); }
.tag.rule { border-style: solid; }
body.no-markers .tag { display: none; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 1.25rem; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
.next { border: 1px solid var(--rule); border-left: 4px solid var(--accent); background: var(--surface); border-radius: var(--r); padding: 1.25rem 1.4rem; display: grid; gap: 0.9rem; }
.next.calm { border-left-color: var(--info); }
.next.done { border-left-color: var(--ok); }
.next h2 { font-size: 1.3rem; }

/* Task list */
.tasks { display: grid; gap: 0.6rem; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 0.9rem; align-items: center; padding: 1rem 1.1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
.task .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.task .ico svg { width: 18px; height: 18px; }
.task-title { font-weight: 600; }
.task-meta { font-size: 0.9rem; color: var(--ink-mute); }
.wait { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--rule); }
.wait li { list-style: none; display: grid; grid-template-columns: minmax(10rem, 14rem) 1fr; gap: 0.25rem 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--rule); }
.wait li .who-w { font-weight: 600; }
.wait ul, ul.wait { margin: 0; padding: 0; }
.empty { padding: 1rem 1.1rem; border: 1px dashed var(--rule-strong); border-radius: var(--r); color: var(--ink-soft); }

/* Campaign cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
.ccard { text-align: left; display: grid; gap: 0.75rem; padding: 1.25rem; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); cursor: pointer; }
.ccard:hover { border-color: var(--ink-soft); }
.ccard, .ccard > * { min-width: 0; }
.ccard .pill { white-space: normal; }
.ccard-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; line-height: 1.25; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }

/* Launch line */
.launch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
.launch > div { padding: 1rem 1.15rem; display: grid; gap: 0.25rem; align-content: start; }
.launch > div + div { border-left: 1px solid var(--rule); }
.launch .when { font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
.launch .when.none { font-family: var(--sans); font-size: 1rem; font-weight: 500; color: var(--ink-mute); }
.launch-note { font-size: 0.92rem; color: var(--ink-soft); margin-top: 0.6rem; }

/* Steps */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; counter-reset: s; margin: 0; padding: 0; }
.steps li { list-style: none; padding: 0.6rem 0.8rem 0.6rem 0; font-size: 0.9rem; color: var(--ink-mute); border-top: 3px solid var(--rule); }
.steps li b { display: block; color: var(--ink-soft); font-weight: 600; }
.steps li.done { border-top-color: var(--ok); }
.steps li.now { border-top-color: var(--accent); color: var(--ink-soft); }
.steps li.now b { color: var(--ink); }

/* Readiness grid */
.grid-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
table.ready { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
table.ready th { text-align: left; font-size: 0.75rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-mute); font-weight: 600; padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.ready td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.ready tr:last-child td { border-bottom: 0; }
table.ready .lang { font-weight: 600; }
table.ready .lang small { display: block; font-weight: 400; color: var(--ink-mute); }
.cell-sub { display: block; font-size: 0.85rem; color: var(--ink-mute); margin-left: 1.45rem; }

/* Language page */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 22rem); gap: 2rem; align-items: start; }
.article { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 1.5rem 1.6rem; display: grid; gap: 0.9rem; }
.article .hl { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; line-height: 1.25; }
.article .bd { font-family: var(--serif); font-size: 1.08rem; line-height: 1.65; max-width: 42rem; display: grid; gap: 0.8rem; }
.article.readonly { background: var(--paper); }
del { background: var(--ins-del); text-decoration: line-through; text-decoration-color: var(--accent); color: var(--ink-soft); }
ins { background: var(--ins-add); text-decoration: none; border-bottom: 2px solid var(--ok); }
.figure { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1rem; align-items: start; padding: 0.9rem 0; border-top: 1px solid var(--rule); }
.figure:first-child { border-top: 0; padding-top: 0; }
.thumb { width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 2px; overflow: hidden; background: var(--paper-deep); display: block; }
.thumb svg { width: 100%; height: 100%; display: block; }
.caption { font-size: 0.95rem; color: var(--ink-soft); }
.vlist { margin: 0; padding: 0; display: grid; }
.vlist li { list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 0.75rem; align-items: center; padding: 0.7rem 0; border-top: 1px solid var(--rule); }
.vnum { font-family: var(--mono); font-size: 0.85rem; padding: 0.1rem 0.45rem; border: 1px solid var(--rule-strong); border-radius: 2px; }
.banner { padding: 1rem 1.15rem; border-radius: var(--r); display: grid; gap: 0.5rem; }
.banner.warn { background: var(--warn-tint); }
.banner.info { background: var(--info-tint); }
.banner.ok { background: var(--ok-tint); }
.banner.act { background: var(--accent-tint); }

/* Forms */
label { font-weight: 600; font-size: 0.95rem; }
.field { display: grid; gap: 0.35rem; }
.hint { font-size: 0.88rem; color: var(--ink-mute); font-weight: 400; }
input[type=text], input[type=datetime-local], input[type=date], input[type=time], textarea, select { width: 100%; min-height: 44px; padding: 0.55rem 0.7rem; border: 1px solid var(--rule-strong); border-radius: var(--r); background: var(--surface); }
textarea { min-height: 12rem; line-height: 1.55; resize: vertical; font-family: var(--serif); font-size: 1.02rem; }
.choice { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.8rem 0.9rem; border: 1px solid var(--rule); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.choice:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input { margin-top: 0.35rem; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.choice span { display: grid; gap: 0.15rem; font-weight: 400; }
.choice strong { font-weight: 600; }
.chipsel { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chipsel label { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; min-height: 44px; border: 1px solid var(--rule-strong); border-radius: 2rem; cursor: pointer; font-weight: 500; background: var(--surface); }
.chipsel label:has(input:checked) { border-color: var(--accent); background: var(--accent-tint); }
.chipsel input { accent-color: var(--accent); }
.wizard-steps { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 0; padding: 0; }
.wizard-steps li { list-style: none; color: var(--ink-mute); font-weight: 500; }
.wizard-steps li[aria-current="step"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.checklist { margin: 0; padding: 0; display: grid; gap: 0.5rem; }
.checklist li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; }
.checklist svg { width: 18px; height: 18px; margin-top: 0.25rem; color: var(--ink-mute); }

/* Review screen */
.review-bar { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--rule); box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
.review-bar .wrap { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; padding-block: 0.9rem; }
.review-bar .spacer { flex: 1 1 12rem; font-size: 0.92rem; color: var(--ink-soft); }
.exact { display: grid; gap: 0.6rem; margin: 0; padding: 0; }
.exact li { list-style: none; display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; font-size: 0.95rem; }
.exact svg { width: 17px; height: 17px; margin-top: 0.25rem; color: var(--ink-soft); }
.fp { font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.04em; }
.conseq { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.5rem; font-size: 0.97rem; }
.note-ins { border-left: 3px solid var(--info); padding: 0.9rem 1.1rem; background: var(--info-tint); border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 0.4rem; }
.note-ins blockquote { margin: 0; font-family: var(--serif); font-size: 1.05rem; }
.toggle { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; font-size: 0.95rem; cursor: pointer; min-height: 44px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Conversation and record */
.msgs { display: grid; gap: 0.75rem; }
.msg { display: grid; gap: 0.2rem; padding: 0.8rem 1rem; border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); max-width: 46rem; }
.msg.ins { background: var(--info-tint); border-color: transparent; }
.msg .from { font-size: 0.88rem; color: var(--ink-mute); }
.msg .from b { color: var(--ink); font-weight: 600; }
.log { margin: 0; padding: 0; }
.log li { list-style: none; display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 1rem; padding: 0.75rem 0; border-top: 1px solid var(--rule); }
.log time { color: var(--ink-mute); font-size: 0.9rem; }

/* Dialog */
.dropzone { border: 2px dashed var(--line, #999); border-radius: 4px; padding: .8rem 1rem; margin-bottom: .8rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.dropzone .hint { flex-basis: 100%; }
.scrim { position: fixed; inset: 0; background: oklch(0.2 0.01 50 / 0.45); z-index: 30; display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.dialog { background: var(--surface); border-radius: 4px; box-shadow: var(--shadow); width: min(36rem, 100%); max-height: 100%; overflow: auto; padding: 1.5rem; display: grid; gap: 1rem; }
.dialog .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: flex-end; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--paper); padding: 0.75rem 1.1rem; border-radius: var(--r); box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 0.95rem; }

/* Prototype controls (simulation) */

function applyPending(mode) {

    const im = c.images.find(i => i.id === p.id); im.versions.push({ v: im.ver + 1, art: 'room', by: me(), at: tick() }); im.ver += 1; im.title = 'Pump installed in a plant room';

    for (const code of codes) { if (c.lang[code].text && !missing(c, code).length) { sendLang(c, code); sent.push(L(code)); sentCodes.push(code); } else held.push(L(code)); }
    if (held.length) toast(`${held.join(', ')} still need${held.length > 1 ? '' : 's'} material.`);
    S.editing = null; afterSend(c, sentCodes); return;
  } else {
    if (p.type !== 'photo') logAdd(c, tick(), PEOPLE[me()].name, `Saved ${p.type === 'caption' ? 'a caption' : 'text'} changes in ${L(p.code)} (not sent)`);
    toast('Saved. Not sent for approval, so the approved versions still count.');
  }
  S.editing = null; render();
}
// After sending: say who approves. An approver gets the approve step straight away, because sending alone approves nothing.
function afterSend(c, codes) {
  if (!codes.length) return render();
  const names = codes.map(L).join(', ');
  if (!canApprove()) { S.dialog = null; render(); toast(`Sent ${names} for approval. Waiting for ${approversText(true)}; INS doesn’t approve your material.`); return; }
  const first = codes[0], v = lastSent(c.lang[first]).v;
  S.dialog = { title: `Sent ${names} for approval`, html: `<p>Sending doesn’t approve anything. You’re an approver, so you can approve ${codes.length > 1 ? 'each language' : 'it'} now${codes.length > 1 ? ', one at a time' : ''}.</p>`,
    actions: [{ label: 'Later', act: 'close', kind: 'quiet' }, { label: `Review and approve ${L(first)} · version ${v}`, act: 'go', kind: 'primary', data: { view: 'review', cid: c.id, code: first, v } }] };
  render();
}
function changeDialog(c, codes, what, extra) {
  // Explains the consequences before a change that touches sent or approved versions.
  const lines = codes.map(code => {
    const ln = c.lang[code], ca = currentApproval(ln), s = lastSent(ln);
    if (!s) return null;
    if (ca) return `<li><strong>${L(code)}:</strong> version ${ca.v} is approved. Sending makes version ${s.v + 1}, and the approval of version ${ca.v} stops counting.${ln.live ? ` Version ${ln.live.v} stays online until INS publishes the update.` : ''}</li>`;
    return `<li><strong>${L(code)}:</strong> version ${s.v} is waiting for approval. Sending makes version ${s.v + 1}, which replaces it.</li>`;
  }).filter(Boolean);
  const together = c.langs.length > 1 && c.mode === 'together' && !c.langs.some(k => c.lang[k].live);
  const deadline = c.confirmed && !c.langs.some(k => c.lang[k].live) ? ` before ${esc(longWhen(c.confirmed))}, or the launch moves` : '';
  S.dialog = { title: 'Send this change for approval, or keep it as a draft?', html: `<p>${what}</p>
    ${extra || ''}
    <p class="small"><strong>Choose one:</strong></p>
    <details class="small"><summary>What this changes for each language</summary><ul style="margin:.5rem 0 0;padding-left:1.2rem;display:grid;gap:.4rem">${lines.join('')}</ul>
    ${together ? `<p style="margin-top:.5rem">All languages launch together, so the whole launch waits until the new version${codes.length > 1 ? 's are' : ' is'} approved.</p>` : ''}</details>`,
    choices: [
      { label: 'Send for approval', hint: `${approversText(true)} must approve the new version${codes.length > 1 ? 's' : ''}${deadline}. The current approval stops counting.`, data: { mode: 'send' }, primary: true },
      { label: 'Keep it as a draft', hint: 'Nothing is sent. The approved version stays the one INS publishes. You can send the change later.', data: { mode: 'save' } }],
    actions: [{ label: 'Cancel', act: 'close', kind: 'quiet' }] };
}

document.addEventListener('keydown', e => {

    const f = [...document.querySelectorAll('.dialog input, .dialog button, .dialog textarea')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
    return;

// Every action re-renders, so put keyboard focus back on the equivalent control.
const _render = render;
render = function () {
  const a = document.activeElement, key = a && a.dataset && a.dataset.act ? JSON.stringify(a.dataset) : null, hadDialog = !!document.querySelector('.dialog');

  if (key) { const m = [...document.querySelectorAll('[data-act]')].find(el => JSON.stringify(el.dataset) === key); m?.focus({ preventScroll: true }); }
};

  { id: 't4', scenario: null, role: 'admin',

const FINAL_RATINGS = ['I always knew what I had to do next.', 'I knew exactly what I was approving.', 'I’d trust this with a real launch.'];
let TST = null;
// Prototype controls (switch person, play INS, jump to situations) are for the owner only. Testers see just the client

let IS_OWNER = null;
const showControls = () => false;
const PUBLIC_FORM = {"action": "https://docs.google.com/forms/d/e/1FAIpQLSfYIx5jny3H2aBJP2JOm0nf1H0yrKiCKDxDcmT-22zVeEjmkg/formResponse", "run": "entry.100290177", "tester": "entry.321281705", "step": "entry.1455372869", "answers": "entry.1451667885"};
const ANSWERS_TO = "axel.idstrom@ins.fi";
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const u = await window.claude.use('user');

const TKEY = 'ins-portal-selftest';
const saveLocal = () => { try { localStorage.setItem(TKEY, JSON.stringify(TST)); } catch (e) {} };
const loadLocal = () => { try { const x = JSON.parse(localStorage.getItem(TKEY) || 'null'); return x && x.active ? x : null; } catch (e) { return null; } };

// The database and the viewer's id, when this view may use them (null otherwise; the copy fallback still works).
const STORE = (async () => {
  try {
    if (!window.claude || !window.claude.use) return null;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return null;

  } catch (e) { return null; }
})();
async function saveRun() {
  if (!TST.runId) TST.runId = new Date().toISOString().slice(0, 10) + '-' + Math.random().toString(36).slice(2, 8);
  const done = TST.tasks.filter(Boolean).length;
  const step = TST.step === 'done' ? 'finished' : TST.step === 'intro' ? 'opened the test' : `after task ${done}`;
  const f = PUBLIC_FORM, body = new URLSearchParams();
  body.set(f.run, TST.runId); body.set(f.tester, TST.name || '(no name yet)'); body.set(f.step, step); body.set(f.answers, resultText());
  try { await fetch(f.action, { method: 'POST', mode: 'no-cors', body }); TST.saved = 'db'; }
  catch (e) { TST.saved = 'copy'; }
  saveLocal();
}

function testSnapshot() {
  const c = camp('x3');
  return { view: S.view.name, code: S.view.code || null, role: S.role,
    langs: Object.fromEntries(c.langs.map(k => [k, { state: langState(c, k).key, versions: c.lang[k].sent.length,
      approved: currentApproval(c.lang[k])?.v ?? null, live: !!c.lang[k].live }])),
    photos: c.images.map(i => i.title + ' v' + i.ver), messages: c.messages.length };
}
function logTestEvent(el) {
  if (!TST || !TST.active || TST.step !== 'task' || !TST.cur || el.dataset.act.startsWith('test-') || el.dataset.act === 'scrim') return;
  if (TST.cur.events.length >= 300) return;
  TST.cur.events.push({ t: Math.round((Date.now() - TST.cur.t0) / 1000), act: el.dataset.act, view: S.view.name,
    code: S.view.code || '', label: (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 50) });
}
const SKEY = 'ins-portal-selftest-state';
const ISO = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d+)?Z$/;
const loadState = i => { try { const x = JSON.parse(localStorage.getItem(SKEY) || 'null', (k, v) => typeof v === 'string' && ISO.test(v) ? new Date(v) : v); return x && x.idx === i ? x.S : null; } catch (e) { return null; } };
const renderPortal = render;
render = function () {
  renderPortal();
  if (TST && TST.active && TST.step === 'task') try { localStorage.setItem(SKEY, JSON.stringify({ idx: TST.idx, S: { ...S, dialog: null, pending: null } })); } catch (e) {}
};
function startTask(i, resume) {
  const task = TEST_TASKS[i];
  const saved = resume ? loadState(i) : null;
  const nm = (TST.name || '').trim();
  PEOPLE.tester.name = nm || 'You'; PEOPLE.tester.first = nm ? nm.split(/\s+/)[0] : 'there';
  // Tasks continue from the previous task's state unless they start a new situation.
  if (saved) S = saved;
  else if (task.scenario || !S) load(task.scenario || 'today', { role: task.role, intro: false, markers: false });
  else { S.role = task.role; S.view = { name: 'home' }; S.dialog = null; S.pending = null; S.editing = null; S.intro = false; S.markers = false; }
  S.panel = false;
  TST.idx = i; TST.step = 'task';
  if (!(saved && TST.cur && TST.cur.id === task.id)) TST.cur = { id: task.id, t0: Date.now(), startedAt: new Date().toISOString(), events: [] };
  saveLocal(); render(); window.scrollTo(0, 0); document.getElementById('main')?.focus({ preventScroll: true });
}
function testBar() {
  const task = TEST_TASKS[TST.idx];
  return `<div class="testbar" role="region" aria-label="Your task"><div class="wrap">
    <p class="tb-text"><b>Task ${TST.idx + 1} of ${TEST_TASKS.length}</b>${esc(task.text)}</p>
    <div class="row"><button class="btn primary" data-act="test-finish" data-outcome="done">I’m done</button><button class="btn" data-act="test-finish" data-outcome="stuck">I’m stuck, skip</button></div>
  </div></div>`;
}
const scale = (name, lo, hi) => `<div class="scale" role="radiogroup" aria-label="${esc(lo)} to ${esc(hi)}">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="${name}" value="${n}"> ${n}</label>`).join('')}</div><p class="hint">1 = ${esc(lo)}, 5 = ${esc(hi)}</p>`;
function viewTest() {
  const head = `<header class="top"><div class="wrap"><span class="logo"><b>/ins</b><span>Client portal · user test</span></span></div></header>`;
  if (TST.step === 'intro') return head + `<main id="main" tabindex="-1"><div class="wrap stack-lg tscreen" style="padding-block:2rem 4rem">
    <div class="stack" style="gap:.5rem"><span class="eyebrow">User test · about 20 minutes</span><h1>Welcome, and thanks for helping</h1></div>
    <p>You’ll try the new INS client portal as a client who has never used it. You are the <strong>client admin at Norrvik Pumps Oy</strong>: you prepare the material, approve it, and look after your company’s use of the portal. Norrvik is launching the AquaLine X3 pump through INS, in English, Finnish and Swedish. Your colleagues also use the portal. Use <strong>View as</strong> at the top right to see it from their side: Maria Lind (approver), Jonas Berg (contributor) and Eero Salo (viewer), then switch back to yourself. The company, the people and the material are fictional, and nothing you do is sent or published.</p>
    <div class="panel stack"><h2 style="font-size:1.15rem">How it works</h2><ul style="margin:0;padding-left:1.2rem;display:grid;gap:.4rem">
      <li>You get <strong>four short tasks</strong>, one at a time. Each task stays at the top of the screen while you work.</li>
      <li>Work it out yourself, as a real client would. There are no wrong answers: if something is unclear, that is what we need to find.</li>
      <li>When you think you’ve finished a task, click <strong>I’m done</strong>. If you’re stuck for a few minutes, click <strong>I’m stuck, skip</strong>. Both are fine.</li>
      <li>After each task you answer a few short questions. At the end there are three ratings.</li>
      <li>If you’re recording yourself, <strong>think aloud</strong>: say what you look for and what surprises you.</li>
      <li>Your answers are saved for Axel at INS as you go.</li></ul></div>
    ${TST.saved === 'db' ? `<div class="banner ok"><strong>Ready.</strong><p>Your answers are sent to Axel automatically after every task. You don’t need to send anything.</p></div>`
      : TST.saved === 'copy' ? `<div class="banner warn"><strong>Your answers can’t be sent automatically right now.</strong><p>Check your internet connection and reload this page. If this message stays, you can still do the test: at the end, use <strong>Email my answers</strong>.</p></div>`
      : `<div class="banner"><strong>Checking that your answers can be saved…</strong></div>`}
    <form class="stack" data-form="test-start"><div class="field"><label for="t-name">Your name</label><input type="text" id="t-name" name="name" value="${esc(TST.name || '')}" autocomplete="name"></div>
    <div class="row"><button class="btn primary" type="submit">Start task 1</button><button class="btn quiet" type="button" data-act="test-quit">Not now</button></div></form></div></main>`;
  if (TST.step === 'post') {
    const task = TEST_TASKS[TST.idx];
    return head + `<main id="main" tabindex="-1"><div class="wrap stack-lg tscreen" style="padding-block:2rem 4rem">
    <div class="stack" style="gap:.5rem"><span class="eyebrow">Task ${TST.idx + 1} of ${TEST_TASKS.length} · a few questions</span><h1>${TST.cur.outcome === 'stuck' ? 'Thanks. Being stuck is useful to know.' : 'Thanks. Now in your own words'}</h1></div>
    <div class="task-card">${esc(task.text)}</div>
    <form class="stack" data-form="test-post">
      ${task.questions.map((q, i) => `<div class="field"><label for="q${i}">${esc(q)}</label><textarea id="q${i}" name="q${i}" style="min-height:4.5rem;font-family:var(--sans);font-size:1rem"></textarea></div>`).join('')}
      <fieldset class="stack" style="border:0;padding:0;margin:0;gap:.4rem"><legend style="font-weight:600;margin-bottom:.35rem">How easy was this task?</legend>${scale('ease', 'very hard', 'very easy')}</fieldset>
      <div class="field"><label for="qx">Anything that confused you? <span class="hint">Optional: words, buttons, where you looked first</span></label><textarea id="qx" name="confusing" style="min-height:4rem;font-family:var(--sans);font-size:1rem"></textarea></div>
      <div><button class="btn primary" type="submit">${TST.idx + 1 < TEST_TASKS.length ? `Continue to task ${TST.idx + 2}` : 'Continue to the last questions'}</button></div>
    </form></div></main>`;
  }
  if (TST.step === 'final') return head + `<main id="main" tabindex="-1"><div class="wrap stack-lg tscreen" style="padding-block:2rem 4rem">
    <div class="stack" style="gap:.5rem"><span class="eyebrow">Last step</span><h1>Three ratings and your thoughts</h1></div>
    <form class="stack-lg" data-form="test-final">
      ${FINAL_RATINGS.map((r, i) => `<fieldset class="stack" style="border:0;padding:0;margin:0;gap:.4rem"><legend style="font-weight:600;margin-bottom:.35rem">${esc(r)}</legend>${scale('r' + i, 'strongly disagree', 'strongly agree')}</fieldset>`).join('')}
      <div class="field"><label for="fw">Which words or labels confused you?</label><textarea id="fw" name="words" style="min-height:4rem;font-family:var(--sans);font-size:1rem"></textarea></div>
      <div class="field"><label for="fo">Anything else? What would you change first?</label><textarea id="fo" name="other" style="min-height:5rem;font-family:var(--sans);font-size:1rem"></textarea></div>
      <div><button class="btn primary" type="submit">Finish the test</button></div>
    </form></div></main>`;
  // done
  return head + `<main id="main" tabindex="-1"><div class="wrap stack-lg tscreen" style="padding-block:2rem 4rem">
    <div class="stack" style="gap:.5rem"><span class="eyebrow">Done</span><h1>Thank you, ${esc(TST.name || 'that was it')}</h1></div>
    ${TST.saved === 'db' ? `<div class="banner ok"><strong>Your answers are saved for Axel.</strong><p>You don’t need to send anything. If you recorded the session, please share the recording with Axel.</p></div>`
      : `<div class="banner warn"><strong>Please send your answers to Axel.</strong><p>They couldn’t be saved automatically from this view. Use Email my answers, or copy them below and send them to Axel.</p></div>`}
    <div class="row"><a class="btn ${TST.saved === 'db' ? '' : 'primary'}" href="mailto:${ANSWERS_TO}?subject=${encodeURIComponent('INS portal test answers' + (TST.name ? ' from ' + TST.name : ''))}&body=${encodeURIComponent(resultText().slice(0, 1800))}">Email my answers</a><button class="btn" data-act="test-copy">Copy my answers</button><button class="btn quiet" data-act="test-quit">Close the test and look around</button></div>
    <textarea id="t-result" readonly style="min-height:12rem;font-family:var(--mono);font-size:.8rem" aria-label="Your answers as text">${esc(resultText())}</textarea>
  </div></main>`;
}
function resultText() {
  const lines = [`INS portal user test — ${TST.name || 'participant'} — ${TST.startedAt}`, `Device: ${TST.device}`, ''];
  TST.tasks.forEach((r, i) => {
    lines.push(`Task ${i + 1}: ${r.outcome.toUpperCase()} in ${r.seconds}s · ease ${r.ease ?? '-'}/5`);
    TEST_TASKS[i].questions.forEach((q, k) => lines.push(`  ${q}\n    ${r.answers['q' + k] || '-'}`));
    if (r.confusing) lines.push(`  Confusing: ${r.confusing}`);
    lines.push(`  Ended on: ${r.snapshot.view}${r.snapshot.code ? ' ' + r.snapshot.code : ''} · ${Object.entries(r.snapshot.langs).map(([k, v]) => k + ' ' + v.state).join(', ')}`);
    lines.push(`  Clicks: ${r.events.map(e => e.label || e.act).join(' › ')}`, '');
  });
  if (TST.final) { FINAL_RATINGS.forEach((q, i) => lines.push(`${q} ${TST.final['r' + i] ?? '-'}/5`)); lines.push(`Confusing words: ${TST.final.words || '-'}`, `Other: ${TST.final.other || '-'}`); }
  return lines.join('\n');
}
Object.assign(ACT, {
  'test-open'() {
    TST = loadLocal() || { active: true, step: 'intro', idx: 0, tasks: [], name: '', startedAt: new Date().toISOString(),
      device: `${window.innerWidth}×${window.innerHeight} · ${/Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'phone' : 'computer'}` };
    if (TST.step === 'task') { startTask(TST.idx, true); return; }
    saveLocal(); render(); window.scrollTo(0, 0);
    if (TST.step === 'intro') { TST.saved = null; saveRun().then(() => { if (TST && TST.step === 'intro') render(); }); }
  },
  'test-finish'(d) {
    const task = TEST_TASKS[TST.idx];
    TST.cur.outcome = d.outcome; TST.cur.seconds = Math.round((Date.now() - TST.cur.t0) / 1000); TST.cur.snapshot = testSnapshot();
    S.dialog = null; TST.step = 'post'; saveLocal(); render(); window.scrollTo(0, 0); document.getElementById('q0')?.focus();
  },
  async 'test-copy'() {
    const ta = document.getElementById('t-result');
    try { await navigator.clipboard.writeText(ta.value); toast('Copied. Paste it into your reply to Axel.'); }
    catch (e) { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C (or Cmd+C) to copy.'); }
  },
  'test-quit'() { if (TST) { TST.active = false; saveLocal(); } TST = null; load('today', { role: 'approver', intro: true, markers: true }); render(); window.scrollTo(0, 0); }
});
document.addEventListener('submit', async e => {
  const f = e.target, d = f.dataset; if (!d.form || !d.form.startsWith('test-')) return;
  const fd = new FormData(f);
  if (d.form === 'test-start') { TST.name = String(fd.get('name') || '').trim(); startTask(0); return; }
  if (d.form === 'test-post') {
    const answers = {}; TEST_TASKS[TST.idx].questions.forEach((q, i) => { answers['q' + i] = String(fd.get('q' + i) || '').trim(); });
    TST.tasks[TST.idx] = { ...TST.cur, answers, ease: fd.get('ease') ? Number(fd.get('ease')) : null, confusing: String(fd.get('confusing') || '').trim() };
    delete TST.tasks[TST.idx].t0;
    saveRun();
    if (TST.idx + 1 < TEST_TASKS.length) startTask(TST.idx + 1);
    else { TST.step = 'final'; saveLocal(); render(); window.scrollTo(0, 0); }
    return;
  }
  if (d.form === 'test-final') {
    TST.final = { r0: Number(fd.get('r0')) || null, r1: Number(fd.get('r1')) || null, r2: Number(fd.get('r2')) || null,
      words: String(fd.get('words') || '').trim(), other: String(fd.get('other') || '').trim() };
    TST.step = 'done'; await saveRun(); saveLocal(); render(); window.scrollTo(0, 0);
  }
});

load('today');
ACT['test-open']();
</script>
